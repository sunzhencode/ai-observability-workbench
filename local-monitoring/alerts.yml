groups:
  - name: local-workbench-demo
    interval: 5s
    rules:
      - record: local_demo_memory_usage_ratio
        expr: vector(0.92)
        labels:
          cluster: local-cluster
          namespace: local-demo
          service: checkout-api
          instance: local-api-1

      - record: local_demo_request_error_ratio
        expr: vector(0.08)
        labels:
          cluster: local-cluster
          namespace: local-demo
          service: checkout-api
          instance: local-api-1

      - alert: LocalHighMemoryUsage
        expr: local_demo_memory_usage_ratio > 0.85
        for: 0s
        labels:
          severity: critical
          cluster: local-cluster
          namespace: local-demo
          service: checkout-api
          instance: local-api-1
        annotations:
          summary: Local checkout API memory usage is above the demo threshold
          description: A deterministic local alert generated by Prometheus for workbench testing.

      - alert: LocalHighErrorRate
        expr: local_demo_request_error_ratio > 0.05
        for: 0s
        labels:
          severity: warning
          cluster: local-cluster
          namespace: local-demo
          service: checkout-api
          instance: local-api-1
        annotations:
          summary: Local checkout API error ratio is above the demo threshold
          description: A deterministic local alert generated by Prometheus for workbench testing.

      - alert: Watchdog
        expr: vector(1)
        for: 0s
        labels:
          severity: none
          cluster: local-cluster
          namespace: local-demo
          service: monitoring
          instance: local-prometheus
        annotations:
          summary: Local monitoring pipeline watchdog
          description: This alert should always be firing while the local Prometheus process is healthy.
