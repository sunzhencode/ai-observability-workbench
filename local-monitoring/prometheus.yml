global:
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    environment: local
    source: local-prometheus

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
